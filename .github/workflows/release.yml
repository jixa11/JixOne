name: Release APK

# Publishing a release is not something this repo's Claude sessions are allowed
# to do through the API, so the build lives here instead: push a v* tag, or
# press "Run workflow", and the APK is built and attached to a GitHub release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without the leading v (e.g. 1.4.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      # The repo ships bun.lock — there is no package-lock.json, so the old
      # `npm ci` step could never succeed and every release run died here.
      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: bun install --frozen-lockfile

      # Optional: sign with the project key so the build installs over the
      # previous one. Without these secrets the APK is debug-signed and the
      # phone will ask for an uninstall first — see docs/SIGNING.md.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.JIXONE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/jixone.keystore
            echo "signing with the project key"
          else
            echo "no JIXONE_KEYSTORE_B64 secret — falling back to the debug key"
          fi

      - name: Build the APK
        env:
          JIXONE_STORE_PASSWORD: ${{ secrets.JIXONE_STORE_PASSWORD }}
          JIXONE_KEY_PASSWORD: ${{ secrets.JIXONE_KEY_PASSWORD }}
          JIXONE_KEY_ALIAS: jixone
        run: ./build-apk.sh "${{ steps.v.outputs.version }}"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: JixOne v${{ steps.v.outputs.version }}
          body_path: docs/RELEASE-NOTES.md
          files: download/JixOne-v${{ steps.v.outputs.version }}.apk

      # Keep the in-app "Get the app" link honest: without this, the web app
      # kept serving the APK from whenever it was last committed by hand.
      - name: Publish the APK into public/
        run: |
          cp "download/JixOne-v${{ steps.v.outputs.version }}.apk" public/JixOne-latest.apk
          cp "download/JixOne-v${{ steps.v.outputs.version }}.apk" "public/JixOne-v${{ steps.v.outputs.version }}.apk"
          git config user.name "jixone-ci"
          git config user.email "actions@users.noreply.github.com"
          git add public/*.apk
          git commit -m "chore(ci): publish JixOne-v${{ steps.v.outputs.version }}.apk [skip ci]" || echo "nothing to commit"
          git push origin HEAD:main
