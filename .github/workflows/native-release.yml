name: Native APK (JixOne)

# Builds the native (Metrolist-based) JixOne Android app.
# Trigger: push a tag starting with "n" (e.g. n2.0.0), a push to the
# native-outertune branch (compile test), or run manually from main.
# The in-app updater reads releases whose tag starts with "n" from
# jixa11/JixOne and expects an asset named JixOne-<version>.apk.
on:
  push:
    branches:
      - native-outertune
    tags:
      - 'n*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (compile test)
        run: ./gradlew --console=plain assembleGmsDebug --warning-mode summary

      - name: Build release APK (debug-signed without keystore, installable)
        run: ./gradlew --console=plain assembleGmsRelease --warning-mode summary

      - name: Collect APKs
        run: |
          set -e
          if [[ "$GITHUB_REF_NAME" == n* ]]; then
            VERSION="${GITHUB_REF_NAME#n}"
          else
            VERSION="dev-$(date +%Y%m%d)"
          fi
          mkdir -p out
          cp app/build/outputs/apk/gms/release/app-gms-release.apk "out/JixOne-${VERSION}.apk" 2>/dev/null \
            || cp app/build/outputs/apk/gms/release/app-gms-release-unsigned.apk "out/JixOne-${VERSION}.apk"
          cp app/build/outputs/apk/gms/debug/*.apk out/ || true
          ls -la out/

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JixOne-native-debug
          path: native/out/*debug*.apk

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JixOne-native-release
          path: native/out/JixOne-*.apk

      - name: Attach APK to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: JixOne ${{ github.ref_name }} (native)
          generate_release_notes: false
          files: native/out/JixOne-*.apk
