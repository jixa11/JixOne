name: Native APK (JixOne)

# Builds the native (OuterTune-based) JixOne Android app.
# Trigger: push a tag starting with "n" (e.g. n1.6.0), or run manually.
on:
  push:
    tags:
      - 'n*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Build debug APK (installable for testing)
        run: ./gradlew assembleCoreDebug --stacktrace -DskipFormatKtlint

      - name: Build release APK (unsigned)
        run: ./gradlew assembleCoreRelease --stacktrace -DskipFormatKtlint

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JixOne-native-debug
          path: native/app/build/outputs/apk/core/debug/*.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: JixOne-native-release-unsigned
          path: native/app/build/outputs/apk/core/release/*.apk

      - name: Attach APKs to release (tag builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/app/build/outputs/apk/core/debug/*.apk
