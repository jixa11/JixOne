name: Native APK (JixOne)

# Builds the native (Metrolist-based) JixOne Android app.
# Trigger: push a tag starting with "n" (e.g. n2.0.0), a push or pull
# request that touches native/ (compile test), or run manually.
# The in-app updater reads releases whose tag starts with "n" from
# jixa11/JixOne and expects assets named JixOne-<version>-<abi>.apk plus
# JixOne-<version>-universal.apk (any JixOne-*.apk without an ABI suffix is
# treated as universal by every shipped updater version).
on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'n*'
    paths:
      - 'native/**'
      - '.github/workflows/native-release.yml'
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/native-release.yml'
  # Manual run. Leave release_version empty for a plain build; give a version
  # (e.g. 6.2.0) to publish that commit as release n<version>, exactly like
  # pushing the tag would.
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish as a release: version without the leading n (e.g. 6.2.0). Empty = build only.'
        required: false
        default: ''

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # "n6.2.0" for a tag push or a manual release run, empty otherwise.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || (inputs.release_version && format('n{0}', inputs.release_version)) || '' }}
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4

      - name: Check the release version
        if: env.RELEASE_TAG != ''
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^n[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release version must look like 6.2.0 (got '$RELEASE_TAG')"; exit 1
          fi
          if ! grep -q "val appVersionName = \"${RELEASE_TAG#n}\"" app/build.gradle.kts; then
            echo "::error::$RELEASE_TAG does not match appVersionName in app/build.gradle.kts"; exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub runners do not ship ~/.android/debug.keystore; generate it so
      # the debug signing config validates.
      - name: Ensure debug keystore exists
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Project signing key — same secret the WebView releases use. Compile
      # test runs fall back to the debug key; a tagged release must not: a
      # debug-signed build cannot install over the previous version.
      - name: Restore the signing key
        env:
          KEYSTORE_B64: ${{ secrets.JIXONE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ../android/jixone.keystore
            echo "signing with the project key"
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::JIXONE_KEYSTORE_B64 is not set — refusing to publish a debug-signed release"
            exit 1
          else
            echo "no JIXONE_KEYSTORE_B64 secret — falling back to the debug key"
          fi

      - name: Build debug APK (compile test)
        run: ./gradlew --console=plain assembleGmsDebug --warning-mode summary

      - name: Build release APK (project-signed, debug fallback)
        env:
          JIXONE_STORE_PASSWORD: ${{ secrets.JIXONE_STORE_PASSWORD }}
          JIXONE_KEY_PASSWORD: ${{ secrets.JIXONE_KEY_PASSWORD }}
          JIXONE_KEY_ALIAS: jixone
        run: ./gradlew --console=plain assembleGmsRelease --warning-mode summary

      # Not on tags yet: the suite never ran in CI before, so it must prove
      # itself on branch builds before it is allowed to block a release.
      - name: Unit tests
        if: env.RELEASE_TAG == ''
        run: ./gradlew --console=plain testGmsDebugUnitTest --warning-mode summary

      - name: Collect APKs
        run: |
          set -e
          # Tag builds (n4.0.1) name the files after the version. Branch runs
          # must NOT match here: the branch "native-outertune" also starts
          # with "n", which used to strip its "n" and produce the nonsense
          # version "ative-outertune". Match tags via GITHUB_REF_TYPE.
          if [[ -n "$RELEASE_TAG" ]]; then
            VERSION="${RELEASE_TAG#n}"
          else
            VERSION="dev-$(date +%Y%m%d)"
          fi
          mkdir -p out
          RELDIR=app/build/outputs/apk/gms/release
          # Per-CPU builds — much smaller downloads; the universal one covers
          # everything else (older 32-bit phones, emulators, odd devices).
          for abi in arm64-v8a armeabi-v7a x86_64; do
            if [ -f "$RELDIR/app-gms-${abi}-release.apk" ]; then
              cp "$RELDIR/app-gms-${abi}-release.apk" "out/JixOne-${VERSION}-${abi}.apk"
            fi
          done
          # Universal APK (name varies by AGP version) — explicitly suffixed
          # "-universal" so users can tell it apart from the per-CPU builds.
          UNIVERSAL="$(ls "$RELDIR/app-gms-release.apk" "$RELDIR/app-gms-universal-release.apk" 2>/dev/null | head -1 || true)"
          if [ -n "$UNIVERSAL" ]; then
            cp "$UNIVERSAL" "out/JixOne-${VERSION}-universal.apk"
          else
            echo "FATAL: no universal release APK found"; ls -la "$RELDIR"; exit 1
          fi
          cp app/build/outputs/apk/gms/debug/*.apk out/ || true
          # Zip-wrapped copy: in some regions .apk downloads get mangled by
          # proxies/accelerators; a .zip survives better and its CRC check
          # makes corruption obvious at extraction time.
          (cd out && zip -q "JixOne-${VERSION}-apk.zip" "JixOne-${VERSION}-universal.apk")
          # Checksums so anyone can verify their download
          (cd out && for f in JixOne-*.apk; do sha256sum "$f" > "$f.sha256"; done)
          ls -la out/

      - name: Upload debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JixOne-native-debug
          path: native/out/*debug*.apk

      - name: Upload release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: JixOne-native-release
          path: native/out/JixOne-*.apk

      # The release description is the newest section of the release notes
      # (everything above the first "---" line). The in-app changelog shows it.
      - name: Extract release notes (release builds)
        if: env.RELEASE_TAG != ''
        working-directory: .
        run: awk '/^---[[:space:]]*$/ { exit } { print }' docs/RELEASE-NOTES.md > release-body.md

      - name: Attach APK to release (release builds)
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: JixOne ${{ env.RELEASE_TAG }} (native)
          body_path: release-body.md
          generate_release_notes: false
          files: |
            native/out/JixOne-*.apk
            native/out/JixOne-*.apk.sha256
            native/out/JixOne-*-apk.zip
